name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 실제 일정이 담긴 자료(tests/fixtures, docs/hwpx_raws, docs/hwpx_fixtures)는
      # 커밋하지 않는다 — 그것을 쓰는 45개는 CI에서 건너뛴다(실패가 아니다).
      # 나머지 127개는 여기서 지켜진다. hwpx 파서는 합성 문서로 검증하므로
      # 원본이 없어도 격자·부기·시간 해석이 CI에서 그대로 확인된다.
      - run: python -m pytest -q
