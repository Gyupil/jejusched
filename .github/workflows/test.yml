name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 픽스처(tests/fixtures)는 실제 일정이라 커밋하지 않는다 —
      # §8 회귀 테스트 27개는 CI에서 건너뛴다. 나머지 50개는 여기서 지켜진다.
      - run: python -m pytest -q
